# Navidrome fnOS 默认配置文件
Address = "0.0.0.0"
Port = 4533
DefaultLanguage = "zh-Hans"

# 默认曲库目录（由启动脚本自动关联飞牛授权池或默认 Music 目录）
MusicFolder = "./var/music_pool"
DataFolder = "./var/data"
CacheFolder = "./var/data/cache"
ScanInterval = "1h"
LogLevel = "info"

# 优先保证移动端与内嵌 Webview 原生 HTTP 206 Partial Content (Range) 支持
AutoTranscodeDownload = false
TranscodingCacheSize = "200MB"

[Transcoding]
MaxConcurrent = 4
MaxConcurrentPerUser = 2
EnableCancellation = true
