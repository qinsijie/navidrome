name: Build fnOS FPK Package

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Navidrome Binary
        run: |
          mkdir -p build_pkg/app
          TAG=$(curl -s https://api.github.com/repos/navidrome/navidrome/releases/latest | jq -r .tag_name)
          echo "Target tag: $TAG"
          curl -sL "https://github.com/navidrome/navidrome/releases/download/${TAG}/navidrome_${TAG#v}_linux_amd64.tar.gz" -o navidrome.tar.gz
          tar -zxvf navidrome.tar.gz -C build_pkg/app/ navidrome
          chmod +x build_pkg/app/navidrome

      - name: Assemble Files
        run: |
          cp -r .fnos/* build_pkg/
          chmod +x build_pkg/service/* build_pkg/cmd/* build_pkg/scripts/* 2>/dev/null || true

      - name: Create FPK Package (Root tar format)
        run: |
          cd build_pkg
          # 关键打包参数：明确格式为 gnu，消除绝对路径前缀，Owner/Group 归零
          tar --numeric-owner --group=0 --owner=0 --format=gnu -zcvf ../navidrome-x86_64.fpk *
          cd ..

      - name: Create FPK Package (Debian / ar format)
        run: |
          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/var/apps/navidrome
          cp -r build_pkg/* deb_pkg/var/apps/navidrome/
          cat <<EOF > deb_pkg/DEBIAN/control
          Package: navidrome
          Version: 0.64.2
          Architecture: amd64
          Maintainer: Navidrome
          Description: Lightweight and fast personal music server for fnOS
          EOF
          if [ -f build_pkg/scripts/postinst ]; then
            cp build_pkg/scripts/postinst deb_pkg/DEBIAN/postinst
            chmod 755 deb_pkg/DEBIAN/postinst
          fi
          dpkg-deb -Zgzip --build --root-owner-group deb_pkg navidrome-deb-x86_64.fpk

      - name: Create FPK Package (Official fnpack format)
        run: |
          curl -sL https://raw.githubusercontent.com/boater-man/FnDepot/main/fnpack-1.2.1-linux-amd64 -o /tmp/fnpack
          chmod +x /tmp/fnpack
          /tmp/fnpack create navidrome_build --without-ui true
          cp .fnos/logo.png navidrome_build/ICON_256.PNG
          cp .fnos/logo.png navidrome_build/ICON.PNG
          cp .fnos/manifest navidrome_build/manifest
          sed -i 's|desktop_applaunchname = navidrome|desktop_applaunchname = navidrome.Application|' navidrome_build/manifest
          cp .fnos/cmd/main navidrome_build/cmd/main
          chmod +x navidrome_build/cmd/main

          mkdir -p navidrome_build/app/app navidrome_build/app/config navidrome_build/app/ui/images
          cp build_pkg/app/navidrome navidrome_build/app/app/
          chmod +x navidrome_build/app/app/navidrome
          cp .fnos/config/navidrome.toml navidrome_build/app/config/
          cp .fnos/config/config.json navidrome_build/app/config/

          cat <<EOF > navidrome_build/app/ui/config
          {
            ".url": {
              "navidrome.Application": {
                "title": "Navidrome",
                "icon": "images/icon_{0}.png",
                "type": "url",
                "protocol": "http",
                "port": 4533,
                "url": "/",
                "allUsers": false
              }
            }
          }
          EOF
          if [ -d .fnos/ui/images ]; then
            cp .fnos/ui/images/* navidrome_build/app/ui/images/
          fi

          cd navidrome_build && /tmp/fnpack build && cp navidrome.fpk ../navidrome-fnpack-x86_64.fpk && cd ..

      - name: Upload FPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navidrome-fnos-fpk
          path: "*.fpk"
