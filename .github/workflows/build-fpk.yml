name: Build fnOS FPK Package

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtag1-dev

      - name: Build Frontend UI
        run: |
          cd ui
          npm ci
          npm run build
          cd ..

      - name: Build Navidrome Binary
        run: |
          mkdir -p build_pkg/app_release build_pkg/app_debug
          PKG_VER=$(grep -E '^[[:space:]]*version[[:space:]]*=' .fnos/manifest | awk -F'=' '{gsub(/[[:space:]]/, "", $2); print $2}')
          echo "Building Navidrome Release v${PKG_VER}..."
          go build -tags=netgo,sqlite_fts5 \
            -ldflags="-s -w -X github.com/navidrome/navidrome/consts.gitSha=${{ github.sha }} -X github.com/navidrome/navidrome/consts.gitTag=v${PKG_VER}" \
            -o build_pkg/app_release/navidrome .
          chmod +x build_pkg/app_release/navidrome

          echo "Building Navidrome Debug (with stream_debug) v${PKG_VER}..."
          go build -tags=netgo,sqlite_fts5,stream_debug \
            -ldflags="-s -w -X github.com/navidrome/navidrome/consts.gitSha=${{ github.sha }} -X github.com/navidrome/navidrome/consts.gitTag=v${PKG_VER}" \
            -o build_pkg/app_debug/navidrome .
          chmod +x build_pkg/app_debug/navidrome

      - name: Create FPK Package (Official fnpack format)
        run: |
          curl -sL https://raw.githubusercontent.com/boater-man/FnDepot/main/fnpack-1.2.1-linux-amd64 -o /tmp/fnpack
          chmod +x /tmp/fnpack
          PKG_VER=$(grep -E '^[[:space:]]*version[[:space:]]*=' .fnos/manifest | awk -F'=' '{gsub(/[[:space:]]/, "", $2); print $2}')
          echo "Packaging version: $PKG_VER"

          pack_fpk() {
            local mode=$1
            local outname=$2
            local workdir="navidrome_build_${mode}"
            rm -rf "${workdir}"
            /tmp/fnpack create "${workdir}" --without-ui true
            cp .fnos/logo.png "${workdir}/ICON_256.PNG"
            cp .fnos/logo.png "${workdir}/ICON.PNG"
            cp .fnos/manifest "${workdir}/manifest"
            sed -i 's|desktop_applaunchname = navidrome|desktop_applaunchname = navidrome.Application|' "${workdir}/manifest"
            if [ "${mode}" = "debug" ]; then
              sed -i 's|display_name = Navidrome|display_name = Navidrome (Debug)|' "${workdir}/manifest"
              sed -i 's|description = .*|description = Navidrome Music Server (Debug Edition with Stream Diagnostics)|' "${workdir}/manifest"
            fi
            cp -r .fnos/cmd/* "${workdir}/cmd/"
            chmod +x "${workdir}/cmd/"*
            mkdir -p "${workdir}/wizard"
            cp -r .fnos/wizard/* "${workdir}/wizard/"

            mkdir -p "${workdir}/app/app" "${workdir}/app/config" "${workdir}/app/ui/images"
            cp "build_pkg/app_${mode}/navidrome" "${workdir}/app/app/navidrome"
            chmod +x "${workdir}/app/app/navidrome"
            cp .fnos/config/navidrome.toml "${workdir}/app/config/"
            cp .fnos/config/config.json "${workdir}/app/config/"

            cat <<EOF > "${workdir}/app/ui/config"
          {
            ".url": {
              "navidrome.Application": {
                "title": "Navidrome",
                "icon": "images/icon_{0}.png",
                "type": "url",
                "protocol": "http",
                "port": 4533,
                "url": "/",
                "allUsers": false
              }
            }
          }
          EOF
            if [ -d .fnos/ui/images ]; then
              cp .fnos/ui/images/* "${workdir}/app/ui/images/"
            fi

            cd "${workdir}"
            /tmp/fnpack build
            cp navidrome.fpk "../${outname}"
            cd ..
          }

          echo "=== Packaging Release FPK ==="
          pack_fpk "release" "navidrome-x86_64-v${PKG_VER}.fpk"

          echo "=== Packaging Debug FPK ==="
          pack_fpk "debug" "navidrome-x86_64-v${PKG_VER}-debug.fpk"

          ls -lh navidrome-x86_64-v*.fpk

      - name: Upload FPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navidrome-fnos-fpk
          path: navidrome-x86_64-v*.fpk
